<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي الوسائط المتعددة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <!-- شاشة البداية -->
  <section id="start" class="screen active">
    <div class="logo">🎨🎬🌐</div>
    <h1>تحدي تقنية الوسائط المتعددة وتقنيات الويب</h1>
    <p>15 سؤالًا في التصميم الجرافيكي، المونتاج، الأنيميشن، وتصميم الويب. هل أنت مستعد؟</p>
    <button id="startBtn" class="btn">ابدأ اللعب</button>
  </section>

  <!-- شاشة الأسئلة -->
  <section id="quiz" class="screen">
    <header class="top">
      <span id="counter">السؤال 1 / 15</span>
      <span id="category" class="tag"></span>
      <span id="score">النقاط: 0</span>
    </header>
    <div class="progress"><div id="bar"></div></div>
    <h2 id="question"></h2>
    <div id="options" class="options"></div>
    <p id="feedback" class="feedback"></p>
    <button id="nextBtn" class="btn hidden">التالي ←</button>
  </section>

  <!-- شاشة النتيجة -->
  <section id="result" class="screen">
    <div id="medal" class="logo"></div>
    <h1>النتيجة النهائية</h1>
    <div class="circle"><span id="final"></span></div>
    <p id="message"></p>
    <details>
      <summary>مراجعة الإجابات</summary>
      <ol id="review"></ol>
    </details>
    <button id="restartBtn" class="btn">🔄 إعادة اللعب</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
